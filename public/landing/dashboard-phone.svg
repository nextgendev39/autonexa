<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1100" width="780" height="1100" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>AutoNexa on a phone with sample data</title>
  <rect width="780" height="1100" fill="#15171b"/>

  <rect x="36" y="34" width="56" height="56" rx="12" fill="#eef0f3"/>
  <text x="64" y="74" font-size="32" font-weight="700" text-anchor="middle" fill="#0e0f12">A</text>
  <text x="110" y="74" font-size="36" font-weight="600" fill="#eef0f3">AutoNexa</text>
  <text x="744" y="72" font-size="24" text-anchor="end" fill="#9ea3ad">Sample data</text>

  <text x="36" y="158" font-size="42" font-weight="600" fill="#eef0f3">Here is today</text>

  <rect x="36" y="192" width="344" height="196" rx="16" fill="#1d1f25"/>
  <text x="62" y="240" font-size="26" fill="#9ea3ad">Cars in stock</text>
  <text x="62" y="316" font-size="72" font-weight="600" fill="#eef0f3">48</text>
  <text x="62" y="360" font-size="23" fill="#9ea3ad">9 ready for sale</text>

  <rect x="400" y="192" width="344" height="196" rx="16" fill="#1d1f25"/>
  <text x="426" y="240" font-size="26" fill="#9ea3ad">Booked</text>
  <text x="426" y="316" font-size="72" font-weight="600" fill="#eef0f3">12</text>
  <text x="426" y="360" font-size="23" fill="#e2b65a">3 deposits due</text>

  <rect x="36" y="408" width="344" height="196" rx="16" fill="#1d1f25"/>
  <text x="62" y="456" font-size="26" fill="#9ea3ad">Outstanding</text>
  <text x="62" y="530" font-size="54" font-weight="600" fill="#eef0f3">AED 186k</text>
  <text x="62" y="576" font-size="23" fill="#9ea3ad">Across 7 bookings</text>

  <rect x="400" y="408" width="344" height="196" rx="16" fill="#2a2d35"/>
  <text x="426" y="456" font-size="26" fill="#c9cdd4">Profit this month</text>
  <text x="426" y="530" font-size="54" font-weight="600" fill="#eef0f3">AED 94k</text>
  <text x="426" y="576" font-size="23" fill="#c9cdd4">From 11 cars sold</text>

  <rect x="36" y="624" width="708" height="440" rx="16" fill="#1d1f25"/>
  <text x="62" y="680" font-size="32" font-weight="600" fill="#eef0f3">Needs attention</text>
  <g fill="#eef0f3" font-size="28">
    <text x="62" y="748">Land Cruiser 2021</text>
    <text x="62" y="848">Camry 2022</text>
    <text x="62" y="948">X5 2019</text>
    <text x="62" y="1030" opacity="0">.</text>
  </g>
  <g fill="#9ea3ad" font-size="23">
    <text x="62" y="782">AN-00142</text>
    <text x="62" y="882">AN-00151</text>
    <text x="62" y="982">AN-00129</text>
  </g>
  <g font-size="22" font-weight="600" text-anchor="middle" fill="#eef0f3">
    <rect x="432" y="726" width="286" height="50" rx="25" fill="#7a5d22"/><text x="575" y="759">Deposit due today</text>
    <rect x="432" y="826" width="286" height="50" rx="25" fill="#7a5d22"/><text x="575" y="859">Price needs approval</text>
    <rect x="432" y="926" width="286" height="50" rx="25" fill="#454a55"/><text x="575" y="959">Purchase to approve</text>
  </g>
  <path d="M62 806h656M62 906h656" stroke="#2a2d35"/>
</svg>
